name: 温泉データを更新

on:
  schedule:
    - cron: "0 18 * * 0" # 毎週月曜 3:00 (JST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/extra-places.json", "scripts/fetch-onsen.mjs"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-onsen.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/onsen.json
          git diff --cached --quiet || git commit -m "温泉データを更新"
          git push
